name: Build MY DAYS NEON APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev cmake

      - name: Install Buildozer
        run: |
          python3 -m pip install --user buildozer cython==0.29.34

      - name: Build APK
        id: build
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          ZIP=$(find . -maxdepth 1 -name "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ZIP archive not found"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          SPEC=$(find extracted -name buildozer.spec -print -quit)

          if [ -z "$SPEC" ]; then
            echo "buildozer.spec not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")
          sed -i '/^android.minapi[[:space:]]*=/d; /^android.ndk_api[[:space:]]*=/d' "$PROJECT_DIR/buildozer.spec"
          printf '\nandroid.minapi = 24\nandroid.ndk_api = 24\n' >> "$PROJECT_DIR/buildozer.spec"
          cd "$PROJECT_DIR"
          echo "charset-normalizer==3.3.2" > "$RUNNER_TEMP/pip-constraints.txt"
          export PIP_CONSTRAINT="$RUNNER_TEMP/pip-constraints.txt"
          buildozer android debug

          APK=$(find bin -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "path=$PROJECT_DIR/$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-DAYS-NEON-APK
          path: ${{ steps.build.outputs.path }}
